map $uri $site_cache_control {
    default 'no-cache';
    ~^/_astro/ 'public, max-age=31536000, immutable';
    ~^/fonts/EarlySummer-VF-Split/[0-9a-f]+\.woff2$ 'public, max-age=31536000, immutable';
    ~*\.(?:woff2|webp|avif|png|jpe?g|gif|svg|ico)$ 'public, max-age=604800';
}

server {
    listen 8080;
    server_name _;
    root /workspace/.local/site/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $site_cache_control always;
    error_page 404 /404.html;

    location = /healthz { access_log off; return 200 'ready'; }
    location = /admin { return 302 /admin/; }
    location ^~ /admin/ {
        client_max_body_size 60m;
        proxy_pass http://127.0.0.1:4310/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4310;
        proxy_set_header Origin http://127.0.0.1:4310;
        proxy_set_header Connection '';
    }
    location = "/2025/07/28/Golang/包/Quic/" { return 301 /posts/golang-quic/; }
    location = "/2025/07/28/Golang/包/Golang Test 工具指令/" { return 301 /posts/golang-package-test/; }
    location = /404.html { internal; }
    location ~ /\. { deny all; }
    location ~ ^/(?:admin|api|src|scripts|node_modules|docker|\.local)(?:/|$) { return 404; }
    location ~* \.(?:html|xml)$ {
        try_files $uri =404;
    }
    location /_astro/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
